name: lean-verify
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: report versions
        run: |
          cat lean-toolchain
          ~/.elan/bin/lake --version
      - name: mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: build and audit
        run: |
          ~/.elan/bin/lake build 2>&1 | tee build.log
          echo "---- axiom audit ----"
          AXLINES=$(grep -c "depends on axioms" build.log || true)
          echo "audited declarations: $AXLINES"
          test "$AXLINES" -ge 95
          BAD=$(sed -n "s/.*depends on axioms: \[\(.*\)\]/\1/p" build.log \
                | tr "," "\n" | tr -d " " | sort -u \
                | grep -vE "^(propext|Classical\.choice|Quot\.sound)$" || true)
          if [ -n "$BAD" ]; then echo "NON-STANDARD AXIOMS: $BAD"; exit 1; fi
          if grep -q "sorryAx\|ofReduceBool" build.log; then echo "ESCAPE HATCH IN BUILD"; exit 1; fi
