name = "RequestProject"
defaultTargets = ["Round1", "Round2", "Round3", "Round4", "AxiomCheck"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "Round1"
globs = ["Round1"]

[[lean_lib]]
name = "Round2"
globs = ["Round2"]

[[lean_lib]]
name = "Round3"
globs = ["Round3"]

[[lean_lib]]
name = "Round4"
globs = ["Round4"]

[[lean_lib]]
name = "AxiomCheck"
globs = ["AxiomCheck"]
